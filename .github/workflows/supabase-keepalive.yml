name: Supabase Keepalive

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping guestbook API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are required."
            exit 1
          fi

      - name: Ping Supabase guestbook REST endpoint
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --show-error --silent \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/guestbook_entries?select=id&limit=1" \
            > /dev/null
